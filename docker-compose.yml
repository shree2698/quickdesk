services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quickdesk-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypasword
      POSTGRES_DB: quickdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d quickdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
